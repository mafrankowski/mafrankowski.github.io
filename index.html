<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prank 😂</title>
    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: Arial, sans-serif;
            color: white;
            margin: 0;
        }

        h1 {
            font-size: 32px;
        }

        button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 18px 35px;
            font-size: 22px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #ff6b81;
            transform: scale(1.1);
        }

        #komunikat {
            display: none;
            font-size: 35px;
            font-weight: bold;
            margin-top: 30px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Kliknij przycisk 😎</h1>

    <button onclick="niespodzianka()">
        Kliknij mnie!
    </button>

    <div id="komunikat">
        HAHAHA NABRAŁEŚ SIĘ! 😂
    </div>

    <script>
        function niespodzianka() {
            document.getElementById("komunikat").style.display = "block";
        }
    </script>

</body>
</html>
